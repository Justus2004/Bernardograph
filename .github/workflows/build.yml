name: Build and Release

on:
  push:
    tags:
      - 'v*' # Der Roboter startet NUR, wenn du einen neuen Version-Tag pushst

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests
        pip install -r requirements.txt

    - name: Code-Test (Syntax prüfen)
      run: python -m py_compile app.py

    - name: App kompilieren
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon=icon.ico app.py

    - name: Version aus Tag auslesen
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      shell: bash

    - name: Setup.exe bauen (Inno Setup)
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer.iss
        options: /dMyAppVersion=${{ env.VERSION }}

    - name: Release veröffentlichen
      uses: softprops/action-gh-release@v2
      with:
        files: Output/Bernardograph_Setup.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}